spring:
  application:
    name: expedicao-atomo-api
  datasource:
    url: jdbc:h2:mem:expedicaoatomo
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 8080

springdoc:
  # Cada endpoint mostra só as respostas declaradas nele, em vez de herdar todas as do GlobalExceptionHandler.
  override-with-generic-response: false
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
